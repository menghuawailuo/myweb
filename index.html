<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d9488">
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="橱柜对账">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<title>橱柜对账</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <!-- 明细：工程列表 -->
  <div class="page active" id="page-home">
    <div class="topbar">
      <h1>账单</h1>
      <button class="btn-icon" data-action="new-project" title="新建工程">＋</button>
    </div>
    <div class="page-body">
      <div id="home-list"></div>
      <div class="empty" id="home-empty" style="display:none">
        <div class="big">🧮</div>
        <p>还没有工程，点右上角「＋」或<br>底部「记一笔」开始</p>
        <button class="btn" data-action="new-project">新建工程</button>
      </div>
    </div>
  </div>

  <!-- 明细：工程详情 -->
  <div class="page" id="page-project">
    <div class="topbar">
      <button class="btn-icon" data-action="back-home">‹</button>
      <h1 id="proj-title">工程</h1>
      <button class="btn-icon" data-action="edit-project" title="编辑">✎</button>
    </div>
    <div class="page-body">
      <div id="proj-info"></div>
      <div class="summary">
        <div class="label">应收金额</div>
        <div class="total" id="proj-total">¥0</div>
        <div class="meta" id="proj-meta"></div>
        <div id="proj-breakdown"></div>
      </div>

      <div class="setting-row">
        <div class="label">默认单价（元/m²）</div>
        <input type="number" inputmode="decimal" id="default-price" step="any" min="0">
      </div>

      <div class="card card-body" style="padding:12px 16px;margin-bottom:12px">
        <div class="info-title">折扣</div>
        <div class="chips" id="discount-type-chips">
          <button type="button" class="chip" data-action="set-discount" data-value="none">无折扣</button>
          <button type="button" class="chip" data-action="set-discount" data-value="rate">按折扣率</button>
          <button type="button" class="chip" data-action="set-discount" data-value="amount">按优惠金额</button>
        </div>
        <div id="discount-input" style="margin-top:10px"></div>
      </div>

      <div class="setting-row">
        <div class="label">已收金额（元）</div>
        <input type="number" inputmode="decimal" id="paid-amount" step="any" min="0">
      </div>

      <div class="setting-row">
        <div class="label">已结清</div>
        <label class="switch">
          <input type="checkbox" id="settled-check">
          <span class="slider"></span>
        </label>
      </div>

      <div class="btn-row" style="margin-bottom:12px">
        <button class="btn secondary" data-action="copy-bill" style="font-size:14px">⧉ 复制账单</button>
        <button class="btn secondary" data-action="export-pdf" style="font-size:14px">📄 导出PDF</button>
        <button class="btn secondary" data-action="export-excel" style="font-size:14px">📊 导出Excel</button>
      </div>

      <div id="room-list"></div>
      <button class="btn secondary" data-action="add-room">＋ 添加房间</button>
      <button class="btn danger" data-action="delete-project" style="margin-top:16px">删除本工程</button>
    </div>
  </div>

  <!-- 分类 -->
  <div class="page" id="page-category">
    <div class="topbar"><h1>分类</h1></div>
    <div class="page-body">
      <div class="card"><div class="card-body">
        <h3>房间分类</h3>
        <div id="category-rooms"></div>
      </div></div>
      <div class="card"><div class="card-body">
        <h3>柜子分类</h3>
        <div id="category-cabinets"></div>
      </div></div>
    </div>
  </div>

  <!-- 统计 -->
  <div class="page" id="page-stats">
    <div class="topbar"><h1>统计</h1></div>
    <div class="page-body">
      <div class="empty" style="padding:80px 20px">
        <div class="big">📊</div>
        <p>统计图表即将上线<br>（工程金额排行 · 房间占比 · 月度趋势）</p>
      </div>
    </div>
  </div>

  <!-- 我的 -->
  <div class="page" id="page-mine">
    <div class="topbar"><h1>我的</h1></div>
    <div class="page-body">
      <div class="setting-row">
        <div class="label">全局默认单价（元/m²）</div>
        <input type="number" inputmode="decimal" id="mine-default-price" step="any" min="0">
      </div>
      <div class="card card-body">
        <div class="info-title">主题色</div>
        <div class="chips" id="theme-chips" style="gap:12px"></div>
      </div>
      <div class="card" style="padding:0">
        <button class="btn ghost" data-action="export-data" style="text-align:left">⬇ 备份数据（下载文件）</button>
        <button class="btn ghost" data-action="import-data" style="text-align:left">⬆ 导入备份</button>
        <input type="file" id="import-file" accept="application/json,.json" style="display:none">
      </div>
      <button class="btn danger" data-action="clear-data" style="margin-top:12px">清空全部数据</button>
      <div class="empty" style="padding:24px 0">
        <p>橱柜对账 · 装修快速对账工具<br>数据仅保存在本机浏览器</p>
      </div>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="tabbar">
    <div class="tab active" data-action="switch-tab" data-tab="detail"><span class="tab-icon">📋</span><span class="tab-label">账单</span></div>
    <div class="tab" data-action="switch-tab" data-tab="category"><span class="tab-icon">🏷️</span><span class="tab-label">分类</span></div>
    <div class="tab-add"><button class="add-btn" data-action="record" aria-label="记一笔">＋</button><span class="tab-label">记一笔</span></div>
    <div class="tab" data-action="switch-tab" data-tab="stats"><span class="tab-icon">📊</span><span class="tab-label">统计</span></div>
    <div class="tab" data-action="switch-tab" data-tab="mine"><span class="tab-icon">👤</span><span class="tab-label">我的</span></div>
  </div>
</div>

<!-- PDF 导出源（离屏渲染） -->
<div id="pdf-src"></div>

<!-- 弹窗 -->
<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
